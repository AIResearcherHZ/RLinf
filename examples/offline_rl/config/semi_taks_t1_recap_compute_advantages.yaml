defaults:
  - model/recap_value_model@advantage.model
  - _self_

advantage:
  value_checkpoint: ${oc.env:T1_RECAP_VALUE_CKPT}
  batch_size: 1024
  flush_interval: 256
  num_dataloader_workers_per_gpu: 12
  prefetch_factor: 2
  discount_next_value: true
  positive_quantile: 0.3
  tag: semi_taks_t1_recap
  returns_tag: semi_taks_t1_recap
  model:
    critic_expert_variant: gemma_1m
    tokenizer_path: /path/to/gemma-3-270m
    siglip_path: /path/to/siglip2-so400m-patch14-224
    gemma3_path: /path/to/gemma-3-270m

data:
  model_type: pi05
  train_data_paths:
    - dataset_path: ${oc.env:T1_SFT_DATA}
      robot_type: semi_taks_t1
      type: sft
      weight: 1.0
    - dataset_path: ${oc.env:T1_ROLLOUT_DATA}
      robot_type: semi_taks_t1
      type: rollout
      weight: 1.0
  advantage_lookahead_step: 10
  gamma: 1.0

distributed:
  enabled: true
  backend: nccl
  timeout: 3600

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/
  job:
    chdir: false
