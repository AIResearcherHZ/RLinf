defaults:
  - env/semi_taks_t1_pickcube_vision@env.train
  - env/semi_taks_t1_pickcube_vision@env.eval
  - model/cnn_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,actor,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:T1_PRETRAIN_LOG,../results/semi_taks_t1_pretrain}
    project_name: rlinf
    experiment_name: semi_taks_t1_pretrain
    logger_backends: [tensorboard]
  max_epochs: 15000
  max_steps: -1
  only_eval: false
  val_check_interval: 210
  save_interval: 210
  weight_sync_interval: 30
  resume_dir: null

algorithm:
  update_epoch: 4
  group_size: 1
  agg_q: min
  actor_agg_q: mean
  backup_entropy: false
  critic_subsample_size: 2
  target_entropy: -2
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  bootstrap_type: standard
  gamma: 0.96
  tau: 0.005
  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.01
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0
  critic_actor_ratio: 4
  replay_buffer:
    enable_cache: true
    cache_size: 20000
    sample_window_size: 20000
    min_buffer_size: 5
    auto_save: true
    auto_save_path: ${oc.env:T1_PRETRAIN_BUFFER,../results/semi_taks_t1_pretrain/replay_buffer}
  target_update_freq: 1
  target_update_type: all

env:
  group_name: EnvGroup
  train:
    obs_format: tensor
    total_num_envs: 1
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    rollout_epoch: 5
    obs_format: tensor
    total_num_envs: 1
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    model_path: ${oc.env:T1_RESNET_PATH}
    state_dim: 7
    action_dim: 4
    num_q_heads: 10
    precision: ${actor.model.precision}
    image_num: 2
  enable_torch_compile: true
  enable_cuda_graph: true

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 256
  global_batch_size: 256
  seed: 42
  enable_offload: false
  enable_drq: true
  compile_model: true
  model:
    model_path: ${oc.env:T1_RESNET_PATH}
    state_dim: 7
    action_dim: 4
    num_q_heads: 10
    image_num: 2
  optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant
  critic_optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
