defaults:
  - env/semi_taks_t1_pickcube_rlt@env.train
  - env/semi_taks_t1_pickcube_rlt@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    env,actor,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:T1_RLT_STAGE2_LOG,../results/semi_taks_t1_rlt_stage2}
    project_name: rlinf-rlt
    experiment_name: semi_taks_t1_rlt_stage2_ac_mlp
    logger_backends: [tensorboard]
  max_epochs: 8000
  max_steps: -1
  only_eval: false
  val_check_interval: 50
  save_interval: 100
  weight_sync_interval: 1
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 8
  group_size: 1
  agg_q: min
  actor_agg_q: q1
  enable_drq: false
  q_head_type: ${actor.model.q_head_type}
  adv_type: embodied_sac
  loss_type: rlt_ac
  loss_agg_func: token-mean
  q_weight: 0.1
  bc_weight: 5.0
  reference_dropout_prob: 0.5
  bootstrap_type: standard
  gamma: 0.96
  tau: 0.005
  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: true
    cache_size: 20000
    min_buffer_size: 100
    sample_window_size: 20000
    auto_save: true
    auto_save_path: ${oc.env:T1_RLT_BUFFER,../results/semi_taks_t1_rlt_stage2/replay_buffer}
  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 2
  critic_actor_ratio: 4
  critic_subsample_size: 0
  backup_entropy: false

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: true
    ignore_terminations: false
  eval:
    rollout_epoch: 5
    total_num_envs: 1
    auto_reset: true
    ignore_terminations: false
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    model_path: null
    precision: ${actor.model.precision}
    action_dim: ${actor.model.action_dim}
    num_action_chunks: ${actor.model.num_action_chunks}
    ref_num_action_chunks: ${actor.model.ref_num_action_chunks}
  rlt_feature_model:
    model_type: openpi_rlinf
    model_path: ${oc.env:T1_RLT_STAGE1_CKPT}
    precision: bf16
    is_lora: false
    num_action_chunks: 10
    action_dim: 4
    num_steps: 5
    add_value_head: false
    openpi_data:
      repo_id: semi_taks_t1_pickcube
      norm_stats_path: ${oc.env:T1_NORM_STATS,null}
    openpi:
      task: eval
      config_name: pi05_semi_taks_t1
      num_images_in_input: 2
      action_chunk: ${actor.model.ref_num_action_chunks}
      action_horizon: ${rollout.rlt_feature_model.num_action_chunks}
      action_env_dim: ${rollout.rlt_feature_model.action_dim}
      num_steps: 5
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 200
      discrete_state_input: true
      state_indices: []
      use_rlt: true
      rlt_prefix_seq_len: 1024
      rlt_image_only: false
      rlt_use_mask: true
  enable_torch_compile: true
  enable_cuda_graph: false

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: false
  model:
    model_type: rlt_mlp_policy
    precision: fp32
    add_value_head: false
    add_q_head: true
    q_head_type: default
    fixed_std: 0.002
    is_lora: false
    z_dim: 2048
    proprio_dim: 7
    action_dim: 4
    num_action_chunks: 10
    ref_num_action_chunks: 10
  optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant
  critic_optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
