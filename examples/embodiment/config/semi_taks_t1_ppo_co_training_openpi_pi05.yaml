defaults:
  - env/semi_taks_t1_pickcube_openpi@env.train
  - env/semi_taks_t1_pickcube_openpi@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:T1_CO_TRAIN_LOG,../results/semi_taks_t1_co_training}
    project_name: rlinf
    experiment_name: semi_taks_t1_ppo_co_training_openpi_pi05
    logger_backends: [tensorboard]
  max_epochs: 1000
  max_steps: -1
  only_eval: false
  val_check_interval: 10
  save_interval: 50
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 2
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 2
    total_num_envs: 1
    auto_reset: true
    use_fixed_reset_state_ids: false
  eval:
    rollout_epoch: 5
    total_num_envs: 1
    auto_reset: true
    ignore_terminations: false
    use_fixed_reset_state_ids: false
    group_size: ${algorithm.group_size}
    is_eval: true
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:T1_SFT_CKPT}
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 32
  seed: 0
  enable_offload: false
  config_name: ${actor.model.openpi.config_name}
  sft_loss_weight: 0.2
  enable_sft_co_train: true
  sft_data_path: ${oc.env:T1_REAL_LEROBOT_DATA}
  model:
    model_path: ${oc.env:T1_SFT_CKPT}
    model_type: openpi
    precision: null
    add_value_head: true
    action_dim: 4
    num_action_chunks: 10
    num_steps: 4
    openpi:
      value_after_vlm: true
      config_name: pi05_semi_taks_t1
      num_images_in_input: 2
      noise_method: flow_noise
      action_horizon: 10
      action_env_dim: 4
      noise_params: [0.16, 0.12, 200]
      joint_logprob: true
    openpi_data:
      repo_id: semi_taks_t1_pickcube
      norm_stats_path: ${oc.env:T1_NORM_STATS,null}
  optim:
    lr: 4.0e-6
    value_lr: 2.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
